[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-bot"
version = "0.1.0"
requires-python = "==3.12.3"

# ── runtime dependencies only ──
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "openai==3.13.0",
  "psycopg[binary]==3.3.5",
  "python-dotenv==1.2.3",
  "uvicorn==0.52.4",
  "pydantic-settings==2.15.0",
  "tenacity==9.1.4"
]

# ── editable-install helper ──
[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

# ── dev / CI / formatting / linting ──
[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-mock==3.14.1",
  "black==26.5.1",
  "ruff==0.16.7",
]

[tool.black]
line-length = 88
target-version = ["py312"]
skip-string-normalization = false
exclude = '''
/(
    \.venv
  | __pycache__
  | migrations
)/
'''

[tool.pytest.ini_options]
markers = [
  "integration: marks tests that hit external APIs",
]
addopts = "-m \"not integration\""

[tool.ruff]
line-length = 88
exclude = [".venv", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
